name: evidence-driven
version: 2
description: RatSight evidence-driven development workflow
artifacts:
  - id: proposal
    generates: proposal.md
    description: Why and scope of the change
    template: proposal.md
    instruction: |
      State motivation, scope, capabilities, and impact. Check `openspec list
      --specs` before naming capabilities; reuse exact existing paths. Set
      `skip_specs: true` only when no requirement-level behavior changes. Do not
      invent a spec delta to satisfy validation.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Observable behavior contracts
    template: spec.md
    instruction: |
      Create a delta for each capability named in the proposal, using its exact
      path. Describe observable behavior, not implementation details. Use
      OpenSpec delta sections and requirement/scenario syntax; run
      `openspec validate <change>` for native validation. Do not duplicate CLI
      checks in custom document rules.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical decisions for changes that need them
    template: design.md
    instruction: |
      Include a design when the change has cross-cutting, architectural,
      dependency, migration, or security decisions. Record the chosen approach,
      rationale, and material risks. Keep simple changes concise.
    requires:
      - proposal

  - id: adversarial-review
    generates: adversarial-review.md
    description: Challenge proposal, specifications, and design before tasks
    template: adversarial-review.md
    instruction: |
      Write this review before tasks.md. Challenge assumptions, requirements,
      design, evidence quality, scientific validity, and failure cases. Record
      the decision, finding IDs, severity, and status in verification/gate.json.
      The gate requires this report and validates recorded decision/finding
      state, but does not inspect the report contents.

      Resolve all BLOCKING findings before tasks.md. Blocking findings cannot
      be waived. A non-blocking ACCEPTED_RISK requires human approval tied to
      that exact finding ID in gate.json.
    requires:
      - specs
      - design

  - id: tasks
    generates: tasks.md
    description: Implementation checklist
    template: tasks.md
    instruction: |
      Write tasks after the adversarial review. Resolve BLOCKING findings before
      implementation; do not waive them. Use OpenSpec checkbox tasks and include
      how each task is verified. Include relevant tests and documentation with
      the work, plus post-implementation review, QA, traceability, gate, and
      human acceptance when required by project policy.

      The schema gates task generation on the adversarial-review artifact. It
      does not check review content. The quality gate checks recorded state in
      verification/gate.json and required review reports, but cannot prove that
      reviews happened or verification commands ran.
    requires:
      - specs
      - design
      - adversarial-review

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Implement completed tasks, update progress honestly, and stop on blockers.
    Follow guidance/openspec-workflow.md for review, QA, traceability, approval
    triggers, and gate commands.

    OpenSpec gates apply on tasks.md. The project gate checks recorded review,
    verification, traceability, and approval state; it cannot authenticate
    these claims. `make openspec-archive` runs the gate before native archive.
    Direct `openspec archive` bypasses that wrapper.
