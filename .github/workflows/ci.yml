name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ratsight/web lint
      - run: pnpm --filter @ratsight/web typecheck
      - run: pnpm --filter @ratsight/web test
      - run: pnpm --filter @ratsight/web build

  python:
    runs-on: ubuntu-latest
    steps:
      # Full history: the changed-only OpenSpec validation diffs against the
      # pull-request base or the pre-push commit. A depth-1 checkout would make
      # that range unresolvable; the script fails instead of validating zero.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm install --global @fission-ai/openspec@1.14.1
      - run: uv sync --locked --all-packages --all-groups
      # Structural OpenSpec validation for touched changes only. Heavyweight
      # behavioral verification and the quality gate stay outside this step.
      - run: uv run --locked python scripts/openspec_validate_changed.py
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
      - run: uv run --locked ruff check .
      - run: uv run --locked basedpyright
      - run: uv run --locked pytest scripts/tests
      - run: uv run --locked pytest services/api/tests
      - run: uv run --locked pytest packages/geo/tests
      - run: uv run --locked pytest packages/simulation/tests
