version: "0.2"
name: rat-team
summary: Evidence-driven RatSight project team. All members run in isolated Pi RPC seats.

startup:
  files:
    - path: guidance/CULTURE.md
      delivery_hint: send_text
      required: true
      applies_on: [fresh_start]
    - path: guidance/project.md
      delivery_hint: send_text
      required: true
      applies_on: [fresh_start]

pods:
  - id: orchestration
    label: Orchestration
    members:
      - id: lead
        agent_ref: "local:.openrig/agents/vendor/orchestration/orchestrator"
        profile: default
        runtime: pi
        model: openai/gpt-5.6-luna
        cwd: "."
        startup:
          files:
            - path: guidance/lead.md
              orientation: role
              delivery_hint: send_text
              required: true
              applies_on: [fresh_start]

  - id: development
    label: Development
    members:
      - id: frontend
        agent_ref: "local:.openrig/agents/vendor/development/implementer"
        profile: default
        runtime: pi
        model: opencode-go/deepseek-v4.1-flash
        cwd: "."
        startup:
          files:
            - path: guidance/frontend.md
              orientation: role
              delivery_hint: send_text
              required: true
              applies_on: [fresh_start]
      - id: backend
        agent_ref: "local:.openrig/agents/vendor/development/implementer"
        profile: default
        runtime: pi
        model: opencode-go/deepseek-v4.1-flash
        cwd: "."
        startup:
          files:
            - path: guidance/backend.md
              orientation: role
              delivery_hint: send_text
              required: true
              applies_on: [fresh_start]

    edges:
      - kind: collaborates_with
        from: frontend
        to: backend

  - id: domain
    label: Domain
    members:
      - id: infrastructure
        agent_ref: "local:.openrig/agents/vendor/research/analyst"
        profile: default
        runtime: pi
        model: openai/gpt-5.6-luna
        cwd: "."
        startup:
          files:
            - path: guidance/infrastructure.md
              orientation: role
              delivery_hint: send_text
              required: true
              applies_on: [fresh_start]
      - id: public-health
        agent_ref: "local:.openrig/agents/vendor/research/analyst"
        profile: default
        runtime: pi
        model: openai/gpt-5.6-luna
        cwd: "."
        startup:
          files:
            - path: guidance/public-health.md
              orientation: role
              delivery_hint: send_text
              required: true
              applies_on: [fresh_start]

  - id: science
    label: Science
    members:
      - id: modeler
        agent_ref: "local:.openrig/agents/vendor/research/analyst"
        profile: default
        runtime: pi
        model: openai/gpt-5.6-luna
        cwd: "."
        startup:
          files:
            - path: guidance/math-modeler.md
              orientation: role
              delivery_hint: send_text
              required: true
              applies_on: [fresh_start]
      - id: researcher
        agent_ref: "local:.openrig/agents/vendor/research/analyst"
        profile: default
        runtime: pi
        model: openai/gpt-5.6-luna
        cwd: "."
        startup:
          files:
            - path: guidance/research-scientist.md
              orientation: role
              delivery_hint: send_text
              required: true
              applies_on: [fresh_start]

  - id: verification
    label: Verification
    members:
      - id: reviewer
        agent_ref: "local:.openrig/agents/vendor/review/independent-reviewer"
        profile: default
        runtime: pi
        model: openai/gpt-5.6-luna
        cwd: "."
        startup:
          files:
            - path: guidance/reviewer.md
              orientation: role
              delivery_hint: send_text
              required: true
              applies_on: [fresh_start]
      - id: qa
        agent_ref: "local:.openrig/agents/vendor/development/qa"
        profile: default
        runtime: pi
        model: opencode-go/deepseek-v4.1-flash
        cwd: "."
        startup:
          files:
            - path: guidance/qa.md
              orientation: role
              delivery_hint: send_text
              required: true
              applies_on: [fresh_start]

edges:
  - kind: delegates_to
    from: orchestration.lead
    to: development.frontend
  - kind: delegates_to
    from: orchestration.lead
    to: development.backend
  - kind: delegates_to
    from: orchestration.lead
    to: domain.infrastructure
  - kind: delegates_to
    from: orchestration.lead
    to: domain.public-health
  - kind: delegates_to
    from: orchestration.lead
    to: science.modeler
  - kind: delegates_to
    from: orchestration.lead
    to: science.researcher
  - kind: delegates_to
    from: orchestration.lead
    to: verification.reviewer
  - kind: delegates_to
    from: orchestration.lead
    to: verification.qa
  - kind: collaborates_with
    from: science.researcher
    to: domain.public-health
  - kind: collaborates_with
    from: science.modeler
    to: domain.infrastructure
  - kind: escalates_to
    from: verification.reviewer
    to: orchestration.lead
