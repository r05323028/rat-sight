[project]
name = "ratsight-api"
version = "0.1.0"
description = "FastAPI and PostGIS service for RatSight"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "defusedxml>=0.7,<1",
  "fastapi>=0.115,<1",
  "geoalchemy2>=0.18,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1,<2",
  "ratsight-geo",
  "ratsight-simulation",
  "sqlalchemy>=2,<3",
  "uvicorn[standard]>=0.34,<1",
]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ratsight_api"]
