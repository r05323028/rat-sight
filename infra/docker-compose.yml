services:
  postgres:
    image: ghcr.io/baosystems/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ratsight}
      POSTGRES_USER: ${POSTGRES_USER:-ratsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ratsight_dev_only}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - ratsight-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ratsight-postgres-data:
